[supervisord]
nodaemon=true

[program:mlflow]
command=mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /app/mlartifacts
autostart=true
autorestart=true
priority=10

[program:training]
command=sh -c "sleep 5 && python main.py"
autostart=true
autorestart=false
priority=20
startsecs=0